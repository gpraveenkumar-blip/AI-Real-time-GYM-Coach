<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="80" y1="40" x2="1120" y2="480" gradientUnits="userSpaceOnUse">
    <stop stop-color="#07111F"/>
    <stop offset="0.55" stop-color="#0C2030"/>
    <stop offset="1" stop-color="#061016"/>
  </linearGradient>
  <linearGradient id="cyan" x1="180" y1="100" x2="1010" y2="390" gradientUnits="userSpaceOnUse">
    <stop stop-color="#67E8F9"/>
